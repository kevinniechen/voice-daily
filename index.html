<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Ten Minute Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column; a four-step strip on top, the active step below, one big action button per step. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#16202c; --muted:#5f6b7a; --line:#dfe3e9;
  --accent:#2f54d4; --accent-soft:#e6ecff; --rec:#d6334a; --ok:#1f8a5b;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11151b; --surface:#1a2029; --ink:#e7ebf1; --muted:#97a2b1; --line:#2b333e;
  --accent:#8aa4ff; --accent-soft:#232d4a; --rec:#ff6b7f; --ok:#4fc58d; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 18px/1.2 var(--ui);margin:0;letter-spacing:-.01em}
.streak{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
.streak i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.streak i.on{background:var(--ok)}
.streak b{font-weight:600;color:var(--ink);margin-left:6px;font-variant-numeric:tabular-nums}

nav.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0 20px}
nav.steps button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 8px 7px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);min-width:0}
nav.steps button span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.steps button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.steps button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
nav.steps button.done span::after{content:" ✓";color:var(--ok)}
nav.steps button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
h2{font:600 22px/1.2 var(--ui);margin:0;text-wrap:balance}
.how{color:var(--muted);margin:0 0 16px;max-width:60ch}
.timer{font:600 22px/1 var(--ui);font-variant-numeric:tabular-nums;background:none;border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer;flex:none}
.timer.run{border-color:var(--accent);color:var(--accent)}
.timer.end{border-color:var(--ok);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.text{font:400 19px/1.65 var(--read);max-width:65ch}
.text p{margin:0 0 .8em}
.text p:last-child{margin:0}
.w{cursor:pointer;border-radius:3px}
.w.mk{font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.src{color:var(--muted);font-size:13px;margin-top:12px}
.src a{color:inherit}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:500 15px/1 var(--ui);padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.rec.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:default}
.grow{flex:1}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.btn.rec.live::before{animation:none}}

ol.moves{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ol.moves li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
ol.moves li.now{border-color:var(--accent);background:var(--accent-soft)}
ol.moves li b{display:block;font-weight:600}
ol.moves li small{color:var(--muted)}
ol.moves .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:1px}

.shadow{position:relative;max-height:46vh;overflow:auto;scroll-behavior:smooth}
.s{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .15s}
.s.cur{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.s.played{color:var(--muted)}
.state{font-size:14px;color:var(--muted);min-height:21px;margin-top:10px;font-variant-numeric:tabular-nums}
.state.you{color:var(--rec);font-weight:600}
select{font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;max-width:100%}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}

.takes{display:grid;gap:8px;margin-top:16px}
.take{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.take .d{font-weight:600;font-variant-numeric:tabular-nums}
.take .tag{font-size:12px;color:var(--muted)}
.take audio{width:100%;height:36px}
.take .x{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px}
.take .x.sure{color:var(--rec);font-weight:600}
.note{font-size:14px;color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13px;line-height:1.6}
footer a{color:inherit}

/* Coach feedback */
.who{color:var(--muted);font-size:12px;width:100%;text-align:right;margin-top:-4px}
.fb{width:100%;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:14.5px}
.fb h4{font:600 12px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.fb h4:first-child{margin-top:0}
.fb p{margin:0 0 8px}
.fb ul{margin:0;padding-left:18px}
.fb li{margin:2px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.mo{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px dashed var(--line)}
.mo:first-of-type{border-top:0}
.mo .ts{font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;
  padding:7px 9px;cursor:pointer;align-self:start;min-height:32px}
.mo .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mo .k.good{color:var(--ok)}
.mo q{font-family:var(--read);font-style:italic;quotes:"\201C" "\201D"}
.mo .try{color:var(--ink)}
.mo .try::before{content:"Try: ";font-weight:600}
.mo.playing{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.fbstate{font-size:14px;color:var(--muted)}
.fbstate.err{color:var(--rec)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
details.fbd summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0;list-style:none}
details.fbd summary::-webkit-details-marker{display:none}
details.fbd summary::before{content:"\25B8  "}
details.fbd[open] summary::before{content:"\25BE  "}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:16px}
.spark{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.spark .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.spark .t b{font:600 20px/1 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums}
.spark svg{display:block;width:100%;height:46px;margin-top:6px;overflow:visible}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.spark .gr{stroke:var(--line);stroke-width:1}
@media (max-width:420px){
  nav.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  nav.steps button{padding:7px 6px}
  .text{font-size:18px}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ten Minute Voice</h1>
    <div class="streak" id="streak" aria-label="Last 14 days"></div>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="view"></main>
  <footer>
    Your recordings and progress are saved to your account, so they follow you across devices. Audio from <a href="https://librivox.org" target="_blank" rel="noopener">LibriVox</a> and text from <a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a>, both public domain, synced sentence by sentence.
  </footer>
</div>
<audio id="player" preload="auto"></audio>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};

/* ---------- small storage: localStorage, mirrored to your account on the server ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("tmv:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tmv:" + k, JSON.stringify(v)); } catch {} sync.soon(); },
  all() { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("tmv:")) o[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } } catch {} return o; },
};
const sync = {
  t: 0, ready: false,
  soon() { if (!this.ready) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 800); },
  push() { return fetch("api/state", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(store.all()), keepalive: true }).catch(() => {}); },
  /* Server copy wins, except practice days, which are merged so no device loses a streak. */
  async pull() {
    try {
      const r = await fetch("api/state"); if (!r.ok) return;
      const srv = await r.json(), loc = store.all();
      const days = { ...(loc.days || {}) };
      for (const [k, v] of Object.entries(srv.days || {})) days[k] = [...new Set([...(days[k] || []), ...v])];
      for (const [k, v] of Object.entries(srv)) try { localStorage.setItem("tmv:" + k, JSON.stringify(v)); } catch {}
      try { localStorage.setItem("tmv:days", JSON.stringify(days)); } catch {}
    } finally { this.ready = true; this.push(); }
  },
};
let ME = null;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- recordings: kept on the server under your account ----------
   IndexedDB only holds takes that haven't uploaded yet (offline, server down); they upload on next load. */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open("tmv", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("takes", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("takes", mode); const out = fn(t.objectStore("takes"));
    t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); };
  return {
    put: v => tx("readwrite", s => s.put(v)).catch(() => null),
    all: () => tx("readonly", s => s.getAll()).catch(() => []),
    del: id => tx("readwrite", s => s.delete(id)).catch(() => null),
  };
})();

/* ---------- recorder ---------- */
const recorder = {
  mr: null, chunks: [], stream: null,
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    this.mr = new MediaRecorder(this.stream, type ? { mimeType: type } : undefined);
    this.chunks = [];
    this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.start(250);
  },
  stop() {
    return new Promise(res => {
      if (!this.mr) return res(null);
      this.mr.onstop = () => {
        this.stream.getTracks().forEach(t => t.stop());
        res(new Blob(this.chunks, { type: this.mr.mimeType || "audio/webm" }));
        this.mr = null;
      };
      this.mr.stop();
    });
  },
  get live() { return !!this.mr; },
};

const api = {
  takes: async () => { try { const r = await fetch("api/takes"); return r.ok ? await r.json() : []; } catch { return []; } },
  take: async id => (await fetch("api/takes/" + encodeURIComponent(id))).json(),
  analyze: async id => (await fetch("api/takes/" + encodeURIComponent(id) + "/analyze", { method: "POST" })).json(),
  del: id => fetch("api/takes/" + encodeURIComponent(id), { method: "DELETE" }),
  async upload(t) {
    const meta = { kind: t.kind, label: t.label, ts: t.ts, secs: t.secs, text: t.text || "", marks: t.marks || [] };
    const r = await fetch("api/takes", { method: "POST", body: t.blob,
      headers: { "Content-Type": t.blob.type || "audio/webm", "X-Take-Meta": encodeURIComponent(JSON.stringify(meta)) } });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || "upload failed");
    return out;
  },
};
/* Upload anything left in IndexedDB: unsent takes, and recordings made before accounts existed. */
async function flushLocal() {
  let n = 0;
  for (const t of await idb.all()) {
    if (!t.blob) { await idb.del(t.id); continue; }
    try { await api.upload(t); await idb.del(t.id); n++; } catch {}
  }
  return n;
}
let TAKES = [];
async function loadTakes() { TAKES = await api.takes(); return TAKES; }

/* A record/playback widget. kind: "daily" | "weekly". meta() returns { label, text, marks }. */
function recWidget(kind, meta, onSaved) {
  const box = h("div", { class: "bar" });
  const btn = h("button", { class: "btn rec", type: "button" }, "Record");
  const msg = h("span", { class: "note" });
  let t0 = 0, iv;
  btn.addEventListener("click", async () => {
    if (!recorder.live) {
      try { await recorder.start(); }
      catch { msg.textContent = "Microphone blocked. Allow it in your browser's site settings, then try again."; return; }
      t0 = Date.now(); btn.classList.add("live"); btn.textContent = "Stop 0:00";
      iv = setInterval(() => btn.textContent = "Stop " + fmt((Date.now() - t0) / 1000), 500);
      msg.textContent = "";
    } else {
      clearInterval(iv); btn.classList.remove("live"); btn.textContent = "Record again";
      const blob = await recorder.stop();
      if (!blob) return;
      const take = { id: kind + ":" + Date.now(), kind, ts: Date.now(), secs: Math.round((Date.now() - t0) / 1000), blob, ...meta() };
      msg.textContent = "Saving…"; btn.disabled = true;
      try { await api.upload(take); msg.textContent = "Saved. Your coach is listening; feedback appears below in a minute or two."; }
      catch (e) { await idb.put(take); msg.textContent = "Couldn't reach the server, so this take is saved on this device and will upload next time. (" + e.message + ")"; }
      btn.disabled = false;
      await loadTakes();
      onSaved && onSaved(take);
    }
  });
  box.append(btn, msg);
  return box;
}

/* ---------- coach feedback ---------- */
const SKILLS = [["pitch_variation", "Pitch"], ["stress", "Stress"], ["pace_and_pauses", "Pace"], ["articulation", "Articulation"], ["endings", "Endings"], ["fluency", "Fluency"]];
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const polling = new Map();
/* Re-render a take's panel until its feedback is done. */
function watch(id, paint) {
  if (polling.has(id)) clearInterval(polling.get(id));
  const iv = setInterval(async () => {
    if (!document.body.contains(paint.el)) { clearInterval(iv); polling.delete(id); return; }
    let t; try { t = await api.take(id); } catch { return; }
    if (!["queued", "processing"].includes(t.status)) { clearInterval(iv); polling.delete(id); const i = TAKES.findIndex(x => x.id === id); if (i >= 0) TAKES[i] = t; }
    paint(t);
  }, 5000);
  polling.set(id, iv);
}
function feedbackPanel(t, audio, open) {
  const el = h("div", { class: "fb" });
  const paint = t => {
    el.innerHTML = "";
    if (t.status === "queued" || t.status === "processing") {
      el.append(h("div", { class: "fbstate" }, t.status === "queued" ? "Waiting for the coach…" : "Coach is listening and writing notes (1 to 2 minutes)…"));
      return watch(t.id, paint);
    }
    if (t.status === "nokey") { el.append(h("div", { class: "fbstate" }, "Feedback isn't switched on yet (no coach API key on the server). This take will be reviewed automatically once it is.")); return; }
    if (t.status === "error") {
      el.append(h("div", { class: "fbstate err" }, "Feedback failed: " + (t.error || "unknown error")),
        h("button", { class: "linkbtn", type: "button", onclick: async () => paint(await api.analyze(t.id)) }, "Try again"));
      return;
    }
    const f = t.feedback; if (!f) return;
    const body = h("div", {},
      h("h4", {}, "Overall"), h("p", {}, f.summary),
      h("div", { class: "pills" }, SKILLS.map(([k, n]) => h("span", { class: "pill" }, n + " ", h("b", {}, f.scores?.[k] ?? "–"), "/5")),
        f.wpm ? h("span", { class: "pill" }, h("b", {}, f.wpm), " wpm") : null),
      f.progress ? [h("h4", {}, "Since last time"), h("p", {}, f.progress)] : null,
      f.priorities?.length ? [h("h4", {}, "Work on next"), h("ul", {}, f.priorities.map(p => h("li", {}, p)))] : null,
      f.strengths?.length ? [h("h4", {}, "Working well"), h("ul", {}, f.strengths.map(p => h("li", {}, p)))] : null,
      f.moments?.length ? [h("h4", {}, "Moment by moment"), ...f.moments.map(m => moment(m, audio))] : null,
      f.drill ? [h("h4", {}, "Tomorrow’s drill"), h("p", {}, f.drill)] : null,
      h("button", { class: "linkbtn", type: "button", onclick: async () => { if (confirm("Ask the coach for a fresh review of this take?")) paint(await api.analyze(t.id)); } }, "Re-review"));
    el.append(h("details", { class: "fbd", open: !!open }, h("summary", {}, "Coach feedback"), body));
  };
  paint.el = el; paint(t);
  return el;
}
/* One timestamped note. Its button plays just that span of your recording. */
function moment(m, audio) {
  const row = h("div", { class: "mo" });
  const ts = h("button", { class: "ts", type: "button", "aria-label": "Play from " + mmss(m.start) }, "▶ " + mmss(m.start));
  ts.addEventListener("click", () => {
    const end = Math.max(m.end, m.start + 1.5) + 0.4;
    audio.currentTime = Math.max(0, m.start - 0.3); audio.play();
    document.querySelectorAll(".mo.playing").forEach(e => e.classList.remove("playing")); row.classList.add("playing");
    const stop = () => { if (audio.currentTime >= end) { audio.pause(); row.classList.remove("playing"); audio.removeEventListener("timeupdate", stop); } };
    audio.addEventListener("timeupdate", stop);
    audio.addEventListener("pause", () => { row.classList.remove("playing"); audio.removeEventListener("timeupdate", stop); }, { once: true });
  });
  row.append(ts, h("div", {},
    h("div", { class: "k" + (m.kind === "good" ? " good" : "") }, m.kind === "good" ? "Nice" : m.kind),
    m.quote ? h("div", {}, h("q", {}, m.quote)) : null,
    h("div", {}, m.note), m.kind !== "good" && m.try ? h("div", { class: "try" }, m.try) : null));
  return row;
}

function takeRow(t, onDelete, tag, open) {
  const x = h("button", { class: "x", type: "button" }, "Delete");
  x.addEventListener("click", async () => {
    if (!x.classList.contains("sure")) { x.classList.add("sure"); x.textContent = "Tap to confirm"; setTimeout(() => { x.classList.remove("sure"); x.textContent = "Delete"; }, 3000); return; }
    await api.del(t.id); await loadTakes(); onDelete && onDelete();
  });

let actx;
function chime() {

    actx ||= new (window.AudioContext || window.webkitAudioContext)();

      const o = actx.createOscillator(), g = actx.createGain();

}

  try { if (on && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } else if (!on && wake) { await wake.release(); wake = null; } } catch {}
}

  const stop = () => { clearInterval(iv); iv = null; keepAwake(false); paint(); };

  const load = () => {

    b.paras.forEach(p => { const el = h("p"); p.forEach(s => { const i = flat.length; const sp = h("span", { class: "s" }, s.t); sp.addEventListener("click", () => { stop(); idx = i; paint(true); play(); }); flat.push({ ...s, el: sp }); el.append(sp, " "); }); box.append(el); });
    idx = Math.min(store.get("pos:" + b.id, 0), flat.length - 1);
    audio.src = b.audio; audio.preload = "auto";
    src.innerHTML = ""; src.append(b.why ? b.why + " " : "", "Read by " + b.reader + " for ", h("a", { href: b.source, target: "_blank", rel: "noopener" }, "LibriVox"), ". Text from ", h("a", { href: b.text, target: "_blank", rel: "noopener" }, "Project Gutenberg"), ".");
    paint(true);

    flat.forEach((s, i) => { s.el.classList.toggle("cur", i === idx); s.el.classList.toggle("played", i < idx); });
    store.set("pos:" + BOOKS[bi].id, idx);
    if (scroll && flat[idx]) { const el = flat[idx].el; box.scrollTop = el.offsetTop - 60; }
    const s = flat[idx];
    if (phase === "idle") state.textContent = "Sentence " + (idx + 1) + " of " + flat.length;

/* One skill over time: a single-series sparkline (latest value large, a dot per session, hover for date). */
function spark(name, pts, lo, hi) {
  pts = pts.filter(p => p.y != null);
  const last = pts[pts.length - 1]?.y ?? "–";
  const ys = pts.map(p => p.y); lo ??= Math.min(...ys) - 5; hi ??= Math.max(...ys) + 5;
  const W = 160, H = 46, pad = 5;
  const X = i => pts.length < 2 ? W / 2 : pad + i * (W - 2 * pad) / (pts.length - 1);
  const Y = y => H - pad - (y - lo) / ((hi - lo) || 1) * (H - 2 * pad);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", name + ": " + ys.join(", "));
  const add = (tag, a, title) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]);
    if (title) { const t = document.createElementNS(ns, "title"); t.textContent = title; e.append(t); } svg.append(e); return e; };
  add("line", { class: "gr", x1: 0, x2: W, y1: H - pad, y2: H - pad, "vector-effect": "non-scaling-stroke" });
  if (pts.length > 1) add("polyline", { class: "ln", points: pts.map((p, i) => X(i) + "," + Y(p.y)).join(" "), "vector-effect": "non-scaling-stroke" });
  pts.forEach((p, i) => add("circle", { class: "dt", cx: X(i), cy: Y(p.y), r: 4, "vector-effect": "non-scaling-stroke" },
    new Date(p.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ": " + p.y));
  return h("div", { class: "spark" }, h("div", { class: "t" }, h("span", {}, name), h("b", {}, last)), svg);
}

async function movedNotice() {
  const old = await idb.all();
  if (!old.length) { location.replace(HOME); return; }
  const v = $("#view"); v.innerHTML = ""; $("#steps").innerHTML = "";
  v.append(h("div", { class: "head" }, h("h2", {}, "Ten Minute Voice has moved")),
    h("p", { class: "how" }, "It now keeps your recordings in your account and gives you coach feedback on each one. You have " + old.length + " older recordings saved in this browser; download any you want to keep, then continue."),
    h("div", { class: "takes" }, old.sort((a, b) => b.ts - a.ts).map(t => h("div", { class: "take" },
      h("span", { class: "d" }, new Date(t.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" })),
      h("span", { class: "tag" }, (t.label || t.kind) + " · " + fmt(t.secs)),
      h("a", { class: "x", href: URL.createObjectURL(t.blob), download: "voice-" + t.kind + "-" + new Date(t.ts).toISOString().slice(0, 10) + (t.blob.type.includes("mp4") ? ".m4a" : ".webm") }, "Download")))),
    h("div", { class: "bar" }, h("a", { class: "btn primary", href: HOME }, "Go to the new site")));
}

/* ---------- boot ---------- */
(async () => {
  if (location.hostname.endsWith("github.io")) return movedNotice();
  try { const r = await fetch("api/me"); if (r.status === 401) { location.href = "/__exe.dev/login?redirect=/"; return; } ME = await r.json(); } catch {}
  try { navigator.storage?.persist && navigator.storage.persist(); } catch {}
  if (ME) { $("#streak").before(h("div", { class: "who" }, ME.email)); await sync.pull(); }
  current = store.get("step", "warm");
  try { BOOKS = await (await fetch("books.json")).json(); } catch { BOOKS = []; }
  buildPages();
  if (ME) { await loadTakes(); flushLocal().then(async n => { if (n) { await loadTakes(); go(current); } }); }
  weeklyCache = await weeklyTakes();
  paintStreak();
  go(STEPS.some(s => s.id === current) ? current : "warm");
})();
</script>
</body>
</html>
