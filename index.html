<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Ten Minute Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column; a step strip on top, the active step below, one big action button per step. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#16202c; --muted:#5f6b7a; --line:#dfe3e9;
  --accent:#2f54d4; --accent-soft:#e6ecff; --rec:#d6334a; --ok:#1f8a5b;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11151b; --surface:#1a2029; --ink:#e7ebf1; --muted:#97a2b1; --line:#2b333e;
  --accent:#8aa4ff; --accent-soft:#232d4a; --rec:#ff6b7f; --ok:#4fc58d; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 18px/1.2 var(--ui);margin:0;letter-spacing:-.01em}
.streak{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
.streak i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.streak i.on{background:var(--ok)}
.streak b{font-weight:600;color:var(--ink);margin-left:6px;font-variant-numeric:tabular-nums}

nav.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0 20px}
nav.steps button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 8px 7px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);min-width:0}
nav.steps button span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.steps button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.steps button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
nav.steps button.done span::after{content:" ✓";color:var(--ok)}
nav.steps button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
h2{font:600 22px/1.2 var(--ui);margin:0;text-wrap:balance}
.how{color:var(--muted);margin:0 0 16px;max-width:60ch}
.timer{font:600 22px/1 var(--ui);font-variant-numeric:tabular-nums;background:none;border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer;flex:none}
.timer.run{border-color:var(--accent);color:var(--accent)}
.timer.end{border-color:var(--ok);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.text{font:400 19px/1.65 var(--read);max-width:65ch}
.text p{margin:0 0 .8em}
.text p:last-child{margin:0}
.w{cursor:pointer;border-radius:3px}
.w.mk{font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.src{color:var(--muted);font-size:13px;margin-top:12px}
.src a{color:inherit}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:500 15px/1 var(--ui);padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.rec.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:default}
.grow{flex:1}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.btn.rec.live::before{animation:none}}

ol.moves{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ol.moves li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
ol.moves li.now{border-color:var(--accent);background:var(--accent-soft)}
ol.moves li b{display:block;font-weight:600}
ol.moves li small{color:var(--muted)}
ol.moves .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:1px}

.shadow{position:relative;max-height:46vh;overflow:auto;scroll-behavior:smooth}
.s{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .15s}
.s.cur{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.s.played{color:var(--muted)}
.state{font-size:14px;color:var(--muted);min-height:21px;margin-top:10px;font-variant-numeric:tabular-nums}
.state.you{color:var(--rec);font-weight:600}
select{font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;max-width:100%}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}

.takes{display:grid;gap:8px;margin-top:16px}
.take{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.take .d{font-weight:600;font-variant-numeric:tabular-nums}
.take .tag{font-size:12px;color:var(--muted)}
.take audio{width:100%;height:36px}
.take .x,.drill .x{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px}
.take .x.sure,.drill .x.sure{color:var(--rec);font-weight:600}
.note{font-size:14px;color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13px;line-height:1.6}
footer a{color:inherit}

/* Coach feedback */
.who{color:var(--muted);font-size:12px;width:100%;text-align:right;margin-top:-4px}
.fb{width:100%;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:14.5px}
.fb h4{font:600 12px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.fb h4:first-child{margin-top:0}
.fb p{margin:0 0 8px}
.fb ul{margin:0;padding-left:18px}
.fb li{margin:2px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.mo{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px dashed var(--line)}
.mo:first-of-type{border-top:0}
.mo .ts{font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;
  padding:7px 9px;cursor:pointer;align-self:start;min-height:32px}
.mo .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mo .k.good{color:var(--ok)}
.mo q{font-family:var(--read);font-style:italic;quotes:"\201C" "\201D"}
.mo .try{color:var(--ink)}
.mo .try::before{content:"Try: ";font-weight:600}
.mo.playing{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.focus{display:grid;gap:2px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 14px;font-size:15px}
.focus .lbl{font:600 11px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.focus small{color:var(--muted);font-size:12px}
.drill{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin:0 0 10px}
.lesson .drill{margin:10px 0 0;background:var(--surface)}
.drill .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drill .dh b{display:block;font-size:15.5px}
.drill .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drill details{margin:8px 0 0;font-size:14.5px}
.drill summary{cursor:pointer;font-weight:600}
.drill ol{margin:6px 0;padding-left:20px}
.drill .bar{margin-top:10px}
.dots{display:flex;gap:4px;padding-top:4px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.got_it{background:var(--ok)} .dots i.almost{background:var(--accent)} .dots i.not_yet{background:var(--rec)}
.att{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.att audio{width:100%;height:36px}
.att .fb{border:0;margin:0;padding:0}
.grade{font-weight:600;margin-bottom:4px}
.grade.got_it{color:var(--ok)} .grade.not_yet{color:var(--rec)} .grade.almost{color:var(--accent)}
details.older{margin:8px 0}
details.older > summary{cursor:pointer;font-size:14px;color:var(--muted);padding:4px 0}
h3.sec{font:600 15px/1.3 var(--ui);margin:20px 0 10px}
h4.sub{font:600 12px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.lesson{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.lesson .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lesson .lt{display:block;font-size:16px;margin:2px 0 8px}
.lesson p{margin:0 0 8px}
.lesson .lbl{font-weight:600}
.lesson .ex{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.lesson .ex ol{margin:8px 0 6px;padding-left:20px}
.lesson .ex li{margin:3px 0}
.lesson .ex p{margin:6px 0 0}
.cite{font:inherit;font-family:var(--read);font-style:italic;color:var(--ink);background:var(--accent-soft);border:0;border-radius:6px;
  padding:1px 6px;margin:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cite span{font:600 11.5px/1 var(--ui);font-style:normal;color:var(--accent);margin-left:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cite:hover,.cite.playing{background:var(--accent);color:var(--bg)}
.cite:hover span,.cite.playing span{color:var(--bg)}
.fbstate{font-size:14px;color:var(--muted)}
.fbstate.err{color:var(--rec)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
details.fbd summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0;list-style:none}
details.fbd summary::-webkit-details-marker{display:none}
details.fbd summary::before{content:"\25B8  "}
details.fbd[open] summary::before{content:"\25BE  "}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:16px}
.spark{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.spark .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.spark .t b{font:600 20px/1 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums}
.spark svg{display:block;width:100%;height:46px;margin-top:6px;overflow:visible}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.spark .gr{stroke:var(--line);stroke-width:1}
@media (max-width:420px){
  nav.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  nav.steps button{padding:7px 6px}
  .text{font-size:18px}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ten Minute Voice</h1>
    <div class="streak" id="streak" aria-label="Last 14 days"></div>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="view"></main>
  <footer>
    Your recordings and progress are saved to your account, so they follow you across devices. Audio from <a href="https://librivox.org" target="_blank" rel="noopener">LibriVox</a> and text from <a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a>, both public domain, synced sentence by sentence.
  </footer>
</div>
<audio id="player" preload="auto"></audio>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};

/* ---------- small storage: localStorage, mirrored to your account on the server ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("tmv:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tmv:" + k, JSON.stringify(v)); } catch {} sync.soon(); },
  all() { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("tmv:")) o[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } } catch {} return o; },
};
const sync = {
  t: 0, ready: false,
  soon() { if (!this.ready) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 800); },
  push() { return fetch("api/state", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(store.all()), keepalive: true }).catch(() => {}); },
  /* Server copy wins, except practice days, which are merged so no device loses a streak. */
  async pull() {
    try {
      const r = await fetch("api/state"); if (!r.ok) return;
      const srv = await r.json(), loc = store.all();
      const days = { ...(loc.days || {}) };
      for (const [k, v] of Object.entries(srv.days || {})) days[k] = [...new Set([...(days[k] || []), ...v])];
      for (const [k, v] of Object.entries(srv)) try { localStorage.setItem("tmv:" + k, JSON.stringify(v)); } catch {}
      try { localStorage.setItem("tmv:days", JSON.stringify(days)); } catch {}
    } finally { this.ready = true; this.push(); }
  },
};
let ME = null;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- recordings: kept on the server under your account ----------
   IndexedDB only holds takes that haven't uploaded yet (offline, server down); they upload on next load. */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open("tmv", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("takes", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("takes", mode); const out = fn(t.objectStore("takes"));
    t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); };
  return {
    put: v => tx("readwrite", s => s.put(v)).catch(() => null),
    all: () => tx("readonly", s => s.getAll()).catch(() => []),
    del: id => tx("readwrite", s => s.delete(id)).catch(() => null),
  };
})();

/* ---------- recorder ---------- */
const recorder = {
  mr: null, chunks: [], stream: null,
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    this.mr = new MediaRecorder(this.stream, type ? { mimeType: type } : undefined);
    this.chunks = [];
    this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.start(250);
  },
  stop() {
    return new Promise(res => {
      if (!this.mr) return res(null);
      this.mr.onstop = () => {
        this.stream.getTracks().forEach(t => t.stop());
        res(new Blob(this.chunks, { type: this.mr.mimeType || "audio/webm" }));
        this.mr = null;
      };
      this.mr.stop();
    });
  },
  get live() { return !!this.mr; },
};

const api = {
  takes: async () => { try { const r = await fetch("api/takes"); return r.ok ? await r.json() : []; } catch { return []; } },
  take: async id => (await fetch("api/takes/" + encodeURIComponent(id))).json(),
  analyze: async id => (await fetch("api/takes/" + encodeURIComponent(id) + "/analyze", { method: "POST" })).json(),
  del: id => fetch("api/takes/" + encodeURIComponent(id), { method: "DELETE" }),
  drills: async () => { try { const r = await fetch("api/drills"); return r.ok ? await r.json() : []; } catch { return []; } },
  makeDrill: async (take_id, lesson) => (await fetch("api/drills", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ take_id, lesson }) })).json(),
  delDrill: id => fetch("api/drills/" + encodeURIComponent(id), { method: "DELETE" }),
  async upload(t) {
    const meta = { kind: t.kind, label: t.label, ts: t.ts, secs: t.secs, text: t.text || "", marks: t.marks || [], drill_id: t.drill_id };
    const r = await fetch("api/takes", { method: "POST", body: t.blob,
      headers: { "Content-Type": t.blob.type || "audio/webm", "X-Take-Meta": encodeURIComponent(JSON.stringify(meta)) } });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || "upload failed");
    return out;
  },
};
/* Upload anything left in IndexedDB: unsent takes, and recordings made before accounts existed. */
async function flushLocal() {
  let n = 0;
  for (const t of await idb.all()) {
    if (!t.blob) { await idb.del(t.id); continue; }
    try { await api.upload(t); await idb.del(t.id); n++; } catch {}
  }
  return n;
}
let TAKES = [], PLAN = null;
/* PLAN: what the coach set for this session, from your most recent review. */
let DRILLS = [];
async function loadTakes() {
  [TAKES, DRILLS] = await Promise.all([api.takes(), api.drills()]);
  PLAN = TAKES.find(t => t.plan)?.plan || null;
  return TAKES;
}
const reads = () => TAKES.filter(t => t.kind !== "drill");
function focusNote(text) {
  if (!text) return "";
  const d = new Date(PLAN.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return h("div", { class: "focus" }, h("span", { class: "lbl" }, "Today’s focus"), h("span", {}, text), h("small", {}, "From your coach, after your " + d + " read"));
}

/* A record/playback widget. kind: "daily" | "weekly". meta() returns { label, text, marks }. */
function recWidget(kind, meta, onSaved) {
  const box = h("div", { class: "bar" });
  const btn = h("button", { class: "btn rec", type: "button" }, "Record");
  const msg = h("span", { class: "note" });
  let t0 = 0, iv;
  btn.addEventListener("click", async () => {
    if (!recorder.live) {
      try { await recorder.start(); }
      catch { msg.textContent = "Microphone blocked. Allow it in your browser's site settings, then try again."; return; }
      t0 = Date.now(); btn.classList.add("live"); btn.textContent = "Stop 0:00";
      iv = setInterval(() => btn.textContent = "Stop " + fmt((Date.now() - t0) / 1000), 500);
      msg.textContent = "";
    } else {
      clearInterval(iv); btn.classList.remove("live"); btn.textContent = "Record again";
      const blob = await recorder.stop();
      if (!blob) return;
      const take = { id: kind + ":" + Date.now(), kind, ts: Date.now(), secs: Math.round((Date.now() - t0) / 1000), blob, ...meta() };
      msg.textContent = "Saving…"; btn.disabled = true;
      let saved = take;
      try { saved = await api.upload(take); msg.textContent = kind === "drill" ? "" : "Saved. Your coach is listening; feedback appears below in a minute or two."; }
      catch (e) { await idb.put(take); msg.textContent = "Couldn't reach the server, so this take is saved on this device and will upload next time. (" + e.message + ")"; }
      btn.disabled = false;
      await loadTakes();
      onSaved && onSaved(saved);
    }
  });
  box.append(btn, msg);
  return box;
}

/* ---------- coach feedback ---------- */
const SKILLS = [["pitch_variation", "Pitch"], ["stress", "Stress"], ["pace_and_pauses", "Pace"], ["articulation", "Articulation"], ["endings", "Endings"], ["fluency", "Fluency"]];
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const polling = new Map();
/* Re-render a take's panel until its feedback is done. */
function watch(id, paint) {

  const iv = setInterval(async () => {
    if (!document.body.contains(paint.el)) { clearInterval(iv); polling.delete(id); return; }
    let t; try { t = await api.take(id); } catch { return; }
    if (!["queued", "processing"].includes(t.status)) { clearInterval(iv); polling.delete(id); const i = TAKES.findIndex(x => x.id === id); if (i >= 0) TAKES[i] = t; }
    paint(t);
  }, 5000);
  polling.set(id, iv);
}
function feedbackPanel(t, audio, open, onDone) {

      return watch(t.id, paint);
    }
    if (waited && onDone) { waited = false; return onDone(t); }

      const g = GRADES[t.feedback.grade] || GRADES.almost;
      el.append(h("div", { class: "grade " + t.feedback.grade }, g[0] + " " + g[1]), h("p", {}, rich(t.feedback.note, audio)),
        t.feedback.tip ? h("p", { class: "try" }, rich(t.feedback.tip, audio)) : null);

    if (t.status === "nokey") { el.append(h("div", { class: "fbstate" }, "Feedback isn't switched on yet (no coach API key on the server). This take will be reviewed automatically once it is.")); return; }

      ),

/* Play just [start, end] of a take, highlighting el while it plays. */
let stopSpan = null;
function playSpan(audio, start, end, el) {
  if (stopSpan) stopSpan();
  const until = Math.max(end, start + 1.5) + 0.4;
  audio.currentTime = Math.max(0, start - 0.3); audio.play();
  el.classList.add("playing");
  const tick = () => { if (audio.currentTime >= until) audio.pause(); };
  const done = () => { el.classList.remove("playing"); audio.removeEventListener("timeupdate", tick); audio.removeEventListener("pause", done); stopSpan = null; };
  audio.addEventListener("timeupdate", tick); audio.addEventListener("pause", done);
  stopSpan = done;
}
/* Coach text with [words](start-end) links turned into buttons that play that moment. */
function rich(text, audio) {
  const out = [], re = /\[([^\]]+)\]\(\s*(\d+(?:\.\d+)?)\s*(?:[-\u2013]\s*(\d+(?:\.\d+)?))?\s*s?\s*\)/g;
  let last = 0, m;
  while ((m = re.exec(text || ""))) {
    out.push(text.slice(last, m.index));
    const s = +m[2], e = m[3] ? +m[3] : s + 1.5;
    const b = h("button", { class: "cite", type: "button", title: "Play " + mmss(s), "aria-label": "Play “" + m[1] + "” at " + mmss(s) },
      m[1], h("span", {}, "▶ " + mmss(s)));
    b.addEventListener("click", () => playSpan(audio, s, e, b));
    out.push(b); last = re.lastIndex;
  }
  out.push((text || "").slice(last));

}

/* ---------- timer + chime ---------- */
let actx;
function chime() {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.start(t); o.stop(t + 0.55);
    });
  } catch {}
  try { navigator.vibrate && navigator.vibrate(120); } catch {}
}
let wake;
async function keepAwake(on) {
  try { if (on && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } else if (!on && wake) { await wake.release(); wake = null; } } catch {}
}
function makeTimer(total, onTick, onEnd) {
  let left = total, iv = null, last;
  const el = h("button", { class: "timer", type: "button", "aria-label": "Start or pause timer" }, fmt(left));
  const paint = () => { el.textContent = left <= 0 ? "Done" : fmt(left); el.classList.toggle("run", !!iv); el.classList.toggle("end", left <= 0); };
  const stop = () => { clearInterval(iv); iv = null; keepAwake(false); paint(); };
  const start = () => {
    if (left <= 0) left = total;
    last = Date.now(); keepAwake(true);
    iv = setInterval(() => {
      const n = Date.now(); left -= (n - last) / 1000; last = n;
      onTick && onTick(total - left);
      if (left <= 0) { left = 0; stop(); chime(); onEnd && onEnd(); }
      paint();
    }, 200);
    paint();
  };
  el.addEventListener("click", () => iv ? stop() : start());
  return { el, start, stop, get running() { return !!iv; } };
}

let BOOKS = [], PAGES = [];
function buildPages() {
  PAGES = [];
  for (const b of BOOKS) {
    let cur = [], n = 0;
    for (const para of b.paras) {
      const text = para.map(s => s.t).join(" ");
      cur.push(text); n += text.split(" ").length;
      if (n >= 140) { PAGES.push({ book: b, paras: cur }); cur = []; n = 0; }
    }
    if (cur.length) PAGES.push({ book: b, paras: cur });
  }
}

function paintStreak() {

    const k = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");

  };
  prev.onclick = () => { pi--; paint(); }; next.onclick = () => { pi++; paint(); };
  paint();
  v.append(wrap, focusNote(PLAN?.read_focus), h("div", { class: "bar", style: "margin:0 0 10px" }, prev, pos, next), card,
    recWidget("daily", () => pageMeta(pi, "Page " + (pi + 1)), paintTakes),
    takes, h("div", { class: "bar" }, nextBtn("read")));
  paintTakes();
  cleanup = () => timer.stop();
}

/* Shadowing: play one sentence, pause for you to repeat, move on. */
function renderShadow(v) {
  const audio = $("#player");
  let bi = store.get("book", 0); if (!BOOKS[bi]) bi = 0;
  let flat = [], idx = 0, phase = "idle", raf = 0, gapT = 0;
  const auto = h("input", { type: "checkbox", id: "auto" }); auto.checked = store.get("auto", true);
  const slow = h("input", { type: "checkbox", id: "slow" }); slow.checked = store.get("slow", false);
  const sel = h("select", { id: "book", "aria-label": "Book" }, BOOKS.map((b, i) => h("option", { value: i }, b.title + ", " + b.author)));
  sel.value = bi;
  const box = h("div", { class: "card shadow text" });
  const state = h("div", { class: "state" });
  const playB = h("button", { class: "btn primary grow", type: "button" }, "Play sentence");
  const prevB = h("button", { class: "btn", type: "button", "aria-label": "Previous sentence" }, "←");
  const againB = h("button", { class: "btn", type: "button" }, "Again");
  const nextB = h("button", { class: "btn", type: "button", "aria-label": "Next sentence" }, "→");
  const src = h("div", { class: "src" });
  const { wrap, timer } = stepHead("Shadow", 120,
    "Listen to one sentence, then say it back right away, copying the narrator’s pitch, pauses, and stress. Tap any sentence to jump there.");

  const load = () => {
    const b = BOOKS[bi]; flat = []; box.innerHTML = "";
    b.paras.forEach(p => { const el = h("p"); p.forEach(s => { const i = flat.length; const sp = h("span", { class: "s" }, s.t); sp.addEventListener("click", () => { stop(); idx = i; paint(true); play(); }); flat.push({ ...s, el: sp }); el.append(sp, " "); }); box.append(el); });
    idx = Math.min(store.get("pos:" + b.id, 0), flat.length - 1);
    audio.src = b.audio; audio.preload = "auto";
    src.innerHTML = ""; src.append(b.why ? b.why + " " : "", "Read by " + b.reader + " for ", h("a", { href: b.source, target: "_blank", rel: "noopener" }, "LibriVox"), ". Text from ", h("a", { href: b.text, target: "_blank", rel: "noopener" }, "Project Gutenberg"), ".");
    paint(true);
  };
  const paint = (scroll) => {
    flat.forEach((s, i) => { s.el.classList.toggle("cur", i === idx); s.el.classList.toggle("played", i < idx); });
    store.set("pos:" + BOOKS[bi].id, idx);
    if (scroll && flat[idx]) { const el = flat[idx].el; box.scrollTop = el.offsetTop - 60; }
    const s = flat[idx];
    if (phase === "idle") state.textContent = "Sentence " + (idx + 1) + " of " + flat.length;
    state.classList.toggle("you", phase === "you");
    playB.textContent = phase === "idle" ? "Play sentence" : "Pause";
  };
  const stop = () => { cancelAnimationFrame(raf); clearTimeout(gapT); audio.pause(); phase = "idle"; paint(); };
  const play = () => {
    const s = flat[idx]; if (!s) return;
    if (!timer.running) timer.start();
    phase = "listen"; audio.playbackRate = slow.checked ? 0.85 : 1;
    const begin = () => { audio.currentTime = s.s; audio.play().catch(() => { phase = "idle"; state.textContent = "Tap Play again to start the audio."; paint(); }); tick(); };
    if (audio.readyState >= 1) begin(); else { state.textContent = "Loading audio…"; audio.addEventListener("loadedmetadata", begin, { once: true }); audio.load(); }
    state.textContent = "Listen…"; paint();
  };
  const tick = () => {
    const s = flat[idx];
    if (audio.currentTime >= s.e) {
      audio.pause();
      phase = "you";
      const gap = Math.max(1.5, (s.e - s.s) / audio.playbackRate * 1.15 + 0.6);
      let left = gap;
      const step = () => {
        state.textContent = "Your turn: say it back  " + Math.ceil(left) + "s";
        if (left <= 0) {
          if (auto.checked && idx < flat.length - 1) { idx++; paint(true); play(); } else { phase = "idle"; paint(); }
          return;
        }
        left -= 0.25; gapT = setTimeout(step, 250);
      };
      paint(); step();
      return;
    }
    raf = requestAnimationFrame(tick);
  };
  playB.onclick = () => phase === "idle" ? play() : stop();
  againB.onclick = () => { stop(); play(); };
  prevB.onclick = () => { stop(); if (idx > 0) idx--; paint(true); };
  nextB.onclick = () => { stop(); if (idx < flat.length - 1) idx++; paint(true); };
  sel.onchange = () => { stop(); bi = +sel.value; store.set("book", bi); load(); };
  auto.onchange = () => store.set("auto", auto.checked);
  slow.onchange = () => store.set("slow", slow.checked);
  v.append(wrap, focusNote(PLAN?.shadow_focus),
    h("div", { class: "bar", style: "margin:0 0 12px" }, sel, h("label", { class: "tog", for: "auto" }, auto, "Auto-advance"), h("label", { class: "tog", for: "slow" }, slow, "Slower")),
    box, state,
    h("div", { class: "bar" }, prevB, playB, againB, nextB), src,
    h("div", { class: "bar" }, nextBtn("shadow")));
  load();
  cleanup = () => { stop(); timer.stop(); };
}

function renderEnun(v) {
  /* -1 is the passage your coach wrote for the sounds you fumble; the rest rotate daily. */
  const coach = PLAN?.enunciate?.text ? { t: PLAN.enunciate.title || "From your coach", a: "Written for you by your coach", p: [PLAN.enunciate.text], how: PLAN.enunciate.how } : null;
  const n = coach ? -1 : Math.floor(Date.now() / 864e5) % ENUNCIATE.length;
  let k = store.get("enunPick:" + today(), n); if (k === -1 && !coach) k = 0;

    "Read it once slowly, exaggerating every mouth movement: full lip rounding, crisp consonants, open vowels. Then once at normal speed.");
  const card = h("div", { class: "card" });
  const paint = () => { const e = k === -1 ? coach : ENUNCIATE[k]; card.innerHTML = "";
    card.append(e.how ? h("p", { class: "note", style: "margin:0 0 12px" }, e.how) : "", h("div", { class: "text" }, e.p.map(p => h("p", {}, p))), h("div", { class: "src" }, e.t + ", " + e.a)); };

  paint();
  v.append(wrap, card, h("div", { class: "bar" }, other), h("div", { class: "bar" }, nextBtn("enun")));
  cleanup = () => timer.stop();
}

/* What the coach needs to know about a page: its text and the words you marked. */
function pageMeta(pi, label) {
  const pg = PAGES[pi], words = pg.paras.join(" ").split(" "), marks = store.get("marks:" + pi, []);
  return { label, text: pg.paras.join("\n\n"), marks: marks.sort((a, b) => a - b).map(i => words[i]).filter(Boolean) };
}

/* Weekly: the same page every week, compared side by side. */
async function weeklyTakes() { return TAKES.filter(t => t.kind === "weekly"); }
let weeklyCache = [];
function weekDue() { const last = weeklyCache[0]; return !last || Date.now() - last.ts > 6.5 * 864e5; }
function renderWeek(v) {
  const pg = PAGES[0];
  const card = h("div", { class: "card" }, h("div", { class: "text" }, pg.paras.map(p => h("p", {}, p))), h("div", { class: "src" }, pg.book.title + ", " + pg.book.author + " · always this page"));
  const list = h("div", { class: "takes" });
  const paint = async () => {
    weeklyCache = await weeklyTakes(); paintNav();
    list.innerHTML = "";
    if (!weeklyCache.length) { list.append(h("div", { class: "empty" }, "No weekly recordings yet. Record this page today; next week you will hear the two side by side.")); return; }
    const [latest, prev] = weeklyCache, first = weeklyCache[weeklyCache.length - 1];
    list.append(h("div", { class: "note" }, "Compare"));
    list.append(takeRow(latest, paint, "This week", true));
    if (prev) list.append(takeRow(prev, paint, "Week before"));
    if (first !== latest && first !== prev) list.append(takeRow(first, paint, "Your first"));
    const rest = weeklyCache.slice(2).filter(t => t !== first);
    if (rest.length) list.append(h("div", { class: "note", style: "margin-top:8px" }, "Earlier"), ...rest.map(t => takeRow(t, paint)));
  };
  v.append(h("div", { class: "head" }, h("h2", {}, "Weekly recording")),
    h("p", { class: "how" }, "Once a week, record this same page. Listen to it next to last week’s: is the pitch moving more, are the marked words landing, are the endings crisp?"),
    card, recWidget("weekly", () => pageMeta(0, "Weekly page"), () => { markStep("week"); paint(); }), list);
  paint();
}

/* Progress: score trends across every reviewed take, then every take with its notes. */
function renderProgress(v) {
  const done = reads().filter(t => t.status === "done" && t.feedback?.scores).slice().reverse();
  v.append(h("div", { class: "head" }, h("h2", {}, "Progress")),
    h("p", { class: "how" }, "Every recording you make is kept here with your coach’s notes. Scores are 1 to 5; tap a timestamp to hear that moment."),
    uploadWidget(() => go("coach")));
  if (DRILLS.length) {
    const active = DRILLS.filter(d => d.status === "active").sort((a, b) => a.due - b.due), learned = DRILLS.filter(d => d.status !== "active");
    v.append(h("h3", { class: "sec" }, "Drills"), ...active.map(d => drillCard(d)),
      learned.length ? h("details", { class: "older" }, h("summary", {}, "Learned (" + learned.length + ")"), learned.map(d => drillCard(d))) : "",
      h("h3", { class: "sec" }, "Recordings"));
  }
  if (done.length) {
    const grid = h("div", { class: "sparks" });
    for (const [k, n] of SKILLS) grid.append(spark(n, done.map(t => ({ ts: t.ts, y: t.feedback.scores?.[k] })), 1, 5));
    const w = done.filter(t => t.feedback.wpm);
    if (w.length) grid.append(spark("Words / min", w.map(t => ({ ts: t.ts, y: t.feedback.wpm })), null, null));
    v.append(grid);
  }
  const list = h("div", { class: "takes" });
  if (!reads().length) list.append(h("div", { class: "empty" }, "No recordings yet. Record yourself in the Read step and your coach’s notes will show up here."));
  reads().forEach((t, i) => list.append(takeRow(t, () => go("coach"), t.kind === "weekly" ? "Weekly" : t.kind === "upload" ? "Uploaded" : null, i === 0)));
  v.append(list);
}
/* One skill over time: a single-series sparkline (latest value large, a dot per session, hover for date). */
function spark(name, pts, lo, hi) {
  pts = pts.filter(p => p.y != null);
  const last = pts[pts.length - 1]?.y ?? "–";
  const ys = pts.map(p => p.y); lo ??= Math.min(...ys) - 5; hi ??= Math.max(...ys) + 5;
  const W = 160, H = 46, pad = 5;
  const X = i => pts.length < 2 ? W / 2 : pad + i * (W - 2 * pad) / (pts.length - 1);
  const Y = y => H - pad - (y - lo) / ((hi - lo) || 1) * (H - 2 * pad);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", name + ": " + ys.join(", "));
  const add = (tag, a, title) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]);
    if (title) { const t = document.createElementNS(ns, "title"); t.textContent = title; e.append(t); } svg.append(e); return e; };
  add("line", { class: "gr", x1: 0, x2: W, y1: H - pad, y2: H - pad, "vector-effect": "non-scaling-stroke" });
  if (pts.length > 1) add("polyline", { class: "ln", points: pts.map((p, i) => X(i) + "," + Y(p.y)).join(" "), "vector-effect": "non-scaling-stroke" });
  pts.forEach((p, i) => add("circle", { class: "dt", cx: X(i), cy: Y(p.y), r: 4, "vector-effect": "non-scaling-stroke" },
    new Date(p.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ": " + p.y));
  return h("div", { class: "spark" }, h("div", { class: "t" }, h("span", {}, name), h("b", {}, last)), svg);
}

/* The app moved off GitHub Pages so recordings can live in your account. Takes recorded there
   are in that browser only. "Move them to my account" goes to the new site, which signs you in
   and sends you back here with a one-time token; this page then uploads them. */
const HOME = "https://voice-daily.exe.xyz/", OLD = "https://kevinniechen.github.io/voice-daily/";
function oldTakeMeta(t) {
  const n = /^Page (\d+)$/.exec(t.label || ""), pi = t.kind === "weekly" ? 0 : n ? +n[1] - 1 : -1;
  return PAGES[pi] ? pageMeta(pi, t.label) : { label: t.label || "" };
}
async function movedNotice() {
  const old = (await idb.all()).filter(t => t.blob).sort((a, b) => a.ts - b.ts);
  const token = (/#import=(\w+)/.exec(location.hash) || [])[1];
  if (!old.length || (store.get("moved", false) && !token)) { location.replace(HOME); return; }
  try { BOOKS = await (await fetch("books.json")).json(); buildPages(); } catch {}
  const v = $("#view"); v.innerHTML = ""; $("#steps").innerHTML = "";
  const status = h("p", { class: "how" });
  v.append(h("div", { class: "head" }, h("h2", {}, "Ten Minute Voice has moved")), status);
  if (token) {
    history.replaceState(null, "", location.pathname);
    let ok = 0, failed = [];
    for (const [i, t] of old.entries()) {
      status.textContent = "Moving your recordings to your account… " + (i + 1) + " of " + old.length;
      try {
        const r = await fetch(HOME + "api/import/take", { method: "POST", body: t.blob, headers: { "Content-Type": t.blob.type || "audio/webm", "X-Import-Token": token,
          "X-Take-Meta": encodeURIComponent(JSON.stringify({ kind: t.kind, ts: t.ts, secs: t.secs, ...oldTakeMeta(t) })) } });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
        ok++;
      } catch (e) { failed.push(e.message); }
    }
    try { const st = store.all(); delete st.moved; await fetch(HOME + "api/import/state", { method: "POST", body: JSON.stringify(st), headers: { "Content-Type": "application/json", "X-Import-Token": token } }); } catch {}
    if (!failed.length) { store.set("moved", true); location.replace(HOME + "#imported=" + ok); return; }
    status.textContent = "Moved " + ok + " of " + old.length + ". The rest didn’t go through (" + failed[0] + "). You can try again or download them below.";
  } else {
    status.textContent = "It now keeps your recordings in your account and gives you coach feedback on each one. You have " + old.length + " recordings saved in this browser. Move them to your account and each one gets reviewed.";
  }
  v.append(h("div", { class: "bar" }, h("a", { class: "btn primary", href: HOME + "?import-old=1" }, "Move them to my account"), h("a", { class: "btn ghost", href: HOME }, "Skip")),
    h("div", { class: "takes" }, old.slice().reverse().map(t => h("div", { class: "take" },
      h("span", { class: "d" }, new Date(t.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" })),
      h("span", { class: "tag" }, (t.label || t.kind) + " · " + fmt(t.secs)),
      h("a", { class: "x", href: URL.createObjectURL(t.blob), download: "voice-" + t.kind + "-" + new Date(t.ts).toISOString().slice(0, 10) + (t.blob.type.includes("mp4") ? ".m4a" : ".webm") }, "Download"),
      h("audio", { controls: true, preload: "none", src: URL.createObjectURL(t.blob) })))));
}
/* New-site half of the move: get a token, hand it to the old site. */
let IMPORTED = false;
async function importHandoff() {
  if (new URLSearchParams(location.search).has("import-old")) {
    const r = await fetch("api/import-token", { method: "POST" }).then(r => r.json()).catch(() => null);
    if (r?.token) { location.replace(OLD + "#import=" + r.token); return true; }
  }
  const n = (/#imported=(\d+)/.exec(location.hash) || [])[1];
  if (n != null) { history.replaceState(null, "", "/"); IMPORTED = true; setTimeout(() => toast("Moved " + n + " recording" + (n === "1" ? "" : "s") + " from the old site. Your coach is reviewing them now."), 300); }
  return false;
}
function toast(msg) {
  const el = h("div", { class: "card", role: "status", style: "margin:0 0 16px;border-color:var(--ok)" }, msg);
  $("#view").before(el); setTimeout(() => el.remove(), 15000);
}

/* Any audio file (another app, a voice memo) can go through the coach too. */
function uploadWidget(onDone) {
  const input = h("input", { type: "file", accept: "audio/*,video/*,.m4a,.webm,.mp3,.wav", multiple: true, style: "display:none" });
  const msg = h("span", { class: "note" });
  const btn = h("button", { class: "btn", type: "button", onclick: () => input.click() }, "Upload a recording");
  input.addEventListener("change", async () => {
    const files = [...input.files]; input.value = ""; let ok = 0;
    for (const [i, f] of files.entries()) {
      msg.textContent = "Uploading " + (i + 1) + " of " + files.length + "…";
      try { await api.upload({ kind: "upload", label: f.name.replace(/\.[^.]+$/, ""), ts: f.lastModified || Date.now(), secs: 0, blob: f }); ok++; }
      catch (e) { msg.textContent = f.name + ": " + e.message; }
    }
    if (ok) { msg.textContent = "Uploaded " + ok + ". Feedback appears below in a minute or two."; await loadTakes(); onDone && onDone(); }
  });
  return h("div", { class: "bar", style: "margin:0 0 16px" }, btn, input, msg);
}

/* ---------- boot ---------- */
(async () => {
  if (location.hostname.endsWith("github.io")) return movedNotice();
  if (await importHandoff()) return;
  try { const r = await fetch("api/me"); if (r.status === 401) { location.href = "/__exe.dev/login?redirect=/"; return; } ME = await r.json(); } catch {}
  try { navigator.storage?.persist && navigator.storage.persist(); } catch {}
  if (ME) { $("#streak").before(h("div", { class: "who" }, ME.email)); await sync.pull(); }
  current = IMPORTED ? "coach" : store.get("step", "warm");
  try { BOOKS = await (await fetch("books.json")).json(); } catch { BOOKS = []; }
  buildPages();
  if (ME) { await loadTakes(); flushLocal().then(async n => { if (n) { await loadTakes(); go(current); } }); }
  weeklyCache = await weeklyTakes();
  paintStreak();
  go(STEPS.some(s => s.id === current) ? current : "warm");
})();
</script>
