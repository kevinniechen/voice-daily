<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voice">
<title>Ten Minute Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column; a step strip on top, the active step below, one big action button per step. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#16202c; --muted:#5f6b7a; --line:#dfe3e9;
  --accent:#2f54d4; --accent-soft:#e6ecff; --rec:#d6334a; --ok:#1f8a5b;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11151b; --surface:#1a2029; --ink:#e7ebf1; --muted:#97a2b1; --line:#2b333e;
  --accent:#8aa4ff; --accent-soft:#232d4a; --rec:#ff6b7f; --ok:#4fc58d; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
body{padding:0}
/* Bottom tab bar, app style */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{all:unset;cursor:pointer;flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font:600 12px/1.2 var(--ui);color:var(--muted);position:relative;-webkit-tap-highlight-color:transparent}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--rec);color:#fff;
  font:700 11px/18px var(--ui);text-align:center;padding:0 5px;box-sizing:border-box}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.hud{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:5px 10px;font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums}
.chip.hot{border-color:#f0a35e;color:#c4581a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;text-align:center}
.stat b{display:block;font:600 24px/1.1 var(--ui);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:5px;justify-content:space-between;margin:0 0 16px}
.days i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.days i.on{background:var(--ok)}
.done-card{text-align:center;padding:28px 18px}
.done-card .big{font:700 44px/1 var(--ui);margin:6px 0}
.install{display:flex;gap:10px;align-items:center;justify-content:space-between}
.install p{margin:0;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:600 18px/1.2 var(--ui);margin:0;letter-spacing:-.01em}
.streak{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
.streak i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.streak i.on{background:var(--ok)}
.streak b{font-weight:600;color:var(--ink);margin-left:6px;font-variant-numeric:tabular-nums}

nav.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 20px}
nav.steps button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 8px 7px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);min-width:0}
nav.steps button span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.steps button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.steps button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
nav.steps button.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
nav.steps button.done small::before{content:"✓ ";color:var(--ok);font-weight:700}
nav.steps button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
h2{font:600 22px/1.2 var(--ui);margin:0;text-wrap:balance}
.how{color:var(--muted);margin:0 0 16px;max-width:60ch}
.timer{font:600 22px/1 var(--ui);font-variant-numeric:tabular-nums;background:none;border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer;flex:none}
.timer.run{border-color:var(--accent);color:var(--accent)}
.timer.end{border-color:var(--ok);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.text{font:400 19px/1.65 var(--read);max-width:65ch}
.text p{margin:0 0 .8em}
.text p:last-child{margin:0}
.w{cursor:pointer;border-radius:3px}
.w.mk{font-weight:600;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.src{color:var(--muted);font-size:13px;margin-top:12px}
.src a{color:inherit}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:500 15px/1 var(--ui);padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.rec.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:default}
.grow{flex:1}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.btn.rec.live::before{animation:none}}

ol.moves{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ol.moves li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
ol.moves li.now{border-color:var(--accent);background:var(--accent-soft)}
ol.moves li b{display:block;font-weight:600}
ol.moves li small{color:var(--muted)}
ol.moves .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:1px}

.shadow{position:relative;max-height:46vh;overflow:auto;scroll-behavior:smooth;margin-top:8px}
body.lesson-mode .shadow{max-height:30vh}
.s{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .15s}
.s.cur{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.s.played{color:var(--muted)}
.state{font-size:14px;color:var(--muted);min-height:21px;margin-top:10px;font-variant-numeric:tabular-nums}
.state.you{color:var(--rec);font-weight:600}
select{font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;max-width:100%}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}

.takes{display:grid;gap:8px;margin-top:16px}
.take{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.take .d{font-weight:600;font-variant-numeric:tabular-nums}
.take .tag{font-size:12px;color:var(--muted)}
.take audio{width:100%;height:36px}
.take .x,.drill .x{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px}
.take .x.sure,.drill .x.sure{color:var(--rec);font-weight:600}
.note{font-size:14px;color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13px;line-height:1.6}
footer[hidden],nav.steps[hidden]{display:none}
footer a{color:inherit}

/* Coach feedback */
.who{color:var(--muted);font-size:12px;width:100%;text-align:right;margin-top:-4px}
.fb{width:100%;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:14.5px}
.fb h4{font:600 12px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.fb h4:first-child{margin-top:0}
.fb p{margin:0 0 8px}
.fb ul{margin:0;padding-left:18px}
.fb li{margin:2px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.mo{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px dashed var(--line)}
.mo:first-of-type{border-top:0}
.mo .ts{font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;
  padding:7px 9px;cursor:pointer;align-self:start;min-height:32px}
.mo .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mo .k.good{color:var(--ok)}
.mo q{font-family:var(--read);font-style:italic;quotes:"\201C" "\201D"}
.mo .try{color:var(--ink)}
.mo .try::before{content:"Try: ";font-weight:600}
.mo.playing{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.focus{display:grid;gap:2px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 14px;font-size:15px}
.focus .lbl{font:600 11px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.focus small{color:var(--muted);font-size:12px}
/* Lesson mode: full screen, like Speak */
body.lesson-mode header, body.lesson-mode .tabs{display:none}
body.lesson-mode .wrap{padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ltop{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 0 14px;background:var(--bg)}
.ltop .lbar{flex:1;margin:0}
.iconbtn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--line)} .iconbtn:focus-visible{outline:2px solid var(--accent)}
.ico{display:inline-grid;place-items:center} .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico svg .fill{fill:currentColor;stroke:none}
.eyebrow{font:700 12px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:4px 0 6px}
.ltitle{font:700 26px/1.2 var(--ui);letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
.lbody .how{font-size:16px}
.move-now{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:4px 0 14px;min-height:150px}
.move-now h3{font:700 22px/1.25 var(--ui);margin:0 0 8px}
.move-now p{margin:0;font-size:16px;color:var(--ink)}
.moves-mini{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.moves-mini li{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.moves-mini li.now{border-color:var(--accent);color:var(--accent);font-weight:600}
.moves-mini li.done{color:var(--ok);border-color:transparent;background:color-mix(in srgb,var(--ok) 12%,transparent)}
/* The dock: one main control at the bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:linear-gradient(to top,var(--bg) 78%,transparent);
  padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.dock > *{width:100%;max-width:608px}
.stage{position:relative;display:grid;gap:8px}
.stage-wave{position:absolute;left:-16px;right:-16px;top:-17px;height:110px;opacity:0;transition:opacity .35s ease;pointer-events:none}
.stage.on .stage-wave{opacity:1}
.inline-rec .stage-wave{top:-16px;height:96px}
.stage .dock-row,.stage .cap{position:relative}
.big-btn.hide{visibility:hidden}
.dock-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.dock-side{display:flex;align-items:center;justify-content:flex-start;padding-bottom:30px}
.dock-mid{display:grid;justify-items:center;gap:8px}
.cap{font:500 13px/1.3 var(--ui);color:var(--muted);min-height:17px;text-align:center;font-variant-numeric:tabular-nums}
.big-btn{all:unset;cursor:pointer;position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .2s ease}
.big-btn .ico svg{width:32px;height:32px}
.big-btn:active{transform:scale(.94)}
.big-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.big-btn[disabled]{opacity:.6;cursor:default}
.big-btn.mic{background:var(--rec);box-shadow:0 6px 18px color-mix(in srgb,var(--rec) 35%,transparent)}
.big-btn.mic.live{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 45%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){.big-btn.mic.live{animation:none;box-shadow:0 0 0 6px color-mix(in srgb,var(--rec) 35%,transparent)}}
.big-btn.play{background:var(--accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.big-btn .ring{position:absolute;inset:-6px} .big-btn .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:4} .ring .prog{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.big-btn.play .ico{position:relative}
.big-btn.sm{width:64px;height:64px} .big-btn.sm .ico svg{width:28px;height:28px}
.inline-rec{display:grid;justify-items:center;gap:8px;margin:18px 0 6px}
.cta{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:#fff;
  font:700 17px/1 var(--ui);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,filter .15s}
.cta:active{transform:scale(.98)} .cta:hover{filter:brightness(1.05)} .cta:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cta[disabled]{opacity:.6}
.btn2{all:unset;box-sizing:border-box;cursor:pointer;min-height:54px;padding:0 20px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink);font:600 16px/1 var(--ui);display:flex;align-items:center;justify-content:center}
.btn2.wide{width:100%;margin-top:4px} .btn2:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* The result sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;background:var(--surface);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.14);padding:22px 16px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:78vh;overflow:auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{width:100%;max-width:608px;display:grid;gap:12px}
.sheet .verdict{font:800 22px/1.2 var(--ui)}
.sheet[data-grade="got_it"]{background:color-mix(in srgb,var(--ok) 10%,var(--surface))} .sheet[data-grade="got_it"] .verdict{color:var(--ok)}
.sheet[data-grade="almost"]{background:color-mix(in srgb,var(--accent) 8%,var(--surface))} .sheet[data-grade="almost"] .verdict{color:var(--accent)}
.sheet[data-grade="not_yet"]{background:color-mix(in srgb,var(--rec) 8%,var(--surface))} .sheet[data-grade="not_yet"] .verdict{color:var(--rec)}
.sheet p{margin:0;font-size:15.5px}
.sheet audio{width:100%;height:40px}
.sheet-actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:4px}
.listening-anim{position:relative;margin:0 -16px;overflow:hidden}
.wave{display:block;width:100%}
.listening-text{text-align:center;font:600 15px/1.3 var(--ui);color:var(--muted);margin-top:2px}
.fb .listening-anim,.att .listening-anim{margin:4px 0;border-radius:12px}
.listening{display:flex;align-items:center;gap:10px;font:600 16px/1.3 var(--ui);color:var(--muted);min-height:40px}
.dots3{display:inline-flex;gap:4px} .dots3 i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blinkd 1.2s infinite}
.dots3 i:nth-child(2){animation-delay:.2s} .dots3 i:nth-child(3){animation-delay:.4s}
@keyframes blinkd{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* Today card and celebration */
.card.intro{padding:24px 20px;display:grid;gap:4px}
.card.intro h2{font:700 24px/1.25 var(--ui);margin:0 0 4px;text-wrap:balance}
.card.intro .how{margin:0 0 14px}
.card.intro .cta{margin-top:8px}
.steplist{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.steplist li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.steplist small{color:var(--muted)}
.celebrate{text-align:center;padding:12vh 8px 0;display:grid;gap:6px;justify-items:center}
.celebrate .big{font:800 64px/1 var(--ui);margin-bottom:10px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.celebrate .big{animation:none}}
.celebrate h2{font:700 26px/1.2 var(--ui);margin:0}
/* Lesson flow */
.lhead{display:flex;justify-content:space-between;font:600 13px/1.3 var(--ui);color:var(--muted);margin:0 0 8px}
.lbar{display:flex;gap:4px;margin:0 0 18px}
.lbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.lbar i.done{background:var(--ok)} .lbar i.now{background:var(--accent)}
.says{padding:16px 18px;margin:0 0 12px}
.says ol{margin:6px 0 0;padding-left:22px;display:grid;gap:10px;font:400 19px/1.5 var(--read)}
details.why{margin:0 0 12px;font-size:15px;color:var(--muted)} details.why summary{cursor:pointer;font-weight:600;color:var(--ink)} details.why p{margin:6px 0 0}
.exb{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;margin:0 0 12px;font-size:15px}
.exb summary{cursor:pointer;font-weight:600}
.exb ol{margin:8px 0;padding-left:20px} .exb li{margin:4px 0} .exb p{margin:6px 0 0}
.pass{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.pass i{width:22px;height:8px;border-radius:4px;background:var(--line)} .pass i.on{background:var(--ok)}
.pass span{margin-left:4px}
/* Practice menu */
.menu{display:grid;gap:8px}
.menu button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.menu b{font-size:16px} .menu span{grid-column:1;color:var(--muted);font-size:14px} .menu i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:22px;color:var(--muted)}
.menu button:focus-visible{outline:2px solid var(--accent)}
details.drill > summary{list-style:none;cursor:pointer} details.drill > summary::-webkit-details-marker{display:none}
/* Journey path */
.path{list-style:none;margin:0 0 8px;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:8px}
.path li{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.path li::before{content:"";position:absolute;left:-26px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.path li.cur{border-color:var(--accent)} .path li.cur::before{background:var(--accent)}
.path li.rev::before,.path li.learned::before{background:var(--ok)}
.path li.more{border:0;background:none;padding:2px 0}
.path summary{cursor:pointer;display:grid;gap:2px;list-style:none} .path summary::-webkit-details-marker{display:none}
.path summary span{font-size:13px;color:var(--muted)}
.lesson-row{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;margin:0 0 8px}
.lesson-row > summary{cursor:pointer;display:grid;gap:2px;list-style:none} .lesson-row > summary::-webkit-details-marker{display:none}
.lesson-row > summary span{font-size:13px;color:var(--muted)}
.drill{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin:0 0 10px}
.lesson .drill{margin:10px 0 0;background:var(--surface)}
.drill .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drill .dh b{display:block;font-size:15.5px}
.drill .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drill details{margin:8px 0 0;font-size:14.5px}
.drill summary{cursor:pointer;font-weight:600}
.drill ol{margin:6px 0;padding-left:20px}
.drill .bar{margin-top:10px}
.dots{display:flex;gap:4px;padding-top:4px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.got_it{background:var(--ok)} .dots i.almost{background:var(--accent)} .dots i.not_yet{background:var(--rec)}
.drill details.last > summary{cursor:pointer;font-size:14px;color:var(--muted);font-weight:600;padding:2px 0}
.att{display:grid;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.att audio{width:100%;height:36px}
.att .fb{border:0;margin:0;padding:0}
.grade{font-weight:600;margin-bottom:4px}
.grade.got_it{color:var(--ok)} .grade.not_yet{color:var(--rec)} .grade.almost{color:var(--accent)}
details.older{margin:8px 0}
details.older > summary{cursor:pointer;font-size:14px;color:var(--muted);padding:4px 0}
h3.sec{font:600 15px/1.3 var(--ui);margin:20px 0 10px}
h4.sub{font:600 12px/1.3 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.lesson{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.lesson .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lesson .lt{display:block;font-size:16px;margin:2px 0 8px}
.lesson p{margin:0 0 8px}
.lesson .lbl{font-weight:600}
.lesson .ex{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.lesson .ex ol{margin:8px 0 6px;padding-left:20px}
.lesson .ex li{margin:3px 0}
.lesson .ex p{margin:6px 0 0}
.cite{font:inherit;font-family:var(--read);font-style:italic;color:var(--ink);background:var(--accent-soft);border:0;border-radius:6px;
  padding:1px 6px;margin:0 1px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cite span{font:600 11.5px/1 var(--ui);font-style:normal;color:var(--accent);margin-left:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cite:hover,.cite.playing{background:var(--accent);color:var(--bg)}
.cite:hover span,.cite.playing span{color:var(--bg)}
.fbstate{font-size:14px;color:var(--muted)}
.fbstate.err{color:var(--rec)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
details.fbd summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0;list-style:none}
details.fbd summary::-webkit-details-marker{display:none}
details.fbd summary::before{content:"\25B8  "}
details.fbd[open] summary::before{content:"\25BE  "}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:16px}
.spark{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}

.spark .dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}

@media (max-width:420px){
  nav.steps{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  nav.steps button{padding:8px 2px;align-items:center;text-align:center}
  nav.steps button span{font-size:11px;overflow:visible;text-overflow:clip;letter-spacing:-.01em}
  nav.steps button small{font-size:10.5px}
  .text{font-size:18px}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ten Minute Voice</h1>
    <div class="hud" id="hud"></div>
  </header>
  <main id="view"></main>
  <footer id="foot">
    Your recordings and progress are saved to your account, so they follow you across devices. Audio from <a href="https://librivox.org" target="_blank" rel="noopener">LibriVox</a> and text from <a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a>, both public domain, synced sentence by sentence.
  </footer>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<audio id="player" preload="auto"></audio>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};

/* ---------- small storage: localStorage, mirrored to your account on the server ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("tmv:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tmv:" + k, JSON.stringify(v)); } catch {} sync.soon(); },
  all() { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("tmv:")) o[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } } catch {} return o; },
};
const sync = {
  t: 0, ready: false,
  soon() { if (!this.ready) return; clearTimeout(this.t); this.t = setTimeout(() => this.push(), 800); },
  push() { return fetch("api/state", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(store.all()), keepalive: true }).catch(() => {}); },
  /* Server copy wins, except practice days, which are merged so no device loses a streak. */
  async pull() {
    try {
      const r = await fetch("api/state"); if (!r.ok) return;
      const srv = await r.json(), loc = store.all();
      const days = { ...(loc.days || {}) };
      for (const [k, v] of Object.entries(srv.days || {})) days[k] = [...new Set([...(days[k] || []), ...v])];
      for (const [k, v] of Object.entries(srv)) try { localStorage.setItem("tmv:" + k, JSON.stringify(v)); } catch {}
      try { localStorage.setItem("tmv:days", JSON.stringify(days)); } catch {}
    } finally { this.ready = true; this.push(); }
  },
};
let ME = null;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- recordings: kept on the server under your account ----------
   IndexedDB only holds takes that haven't uploaded yet (offline, server down); they upload on next load. */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open("tmv", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("takes", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("takes", mode); const out = fn(t.objectStore("takes"));
    t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); };
  return {
    put: v => tx("readwrite", s => s.put(v)).catch(() => null),
    all: () => tx("readonly", s => s.getAll()).catch(() => []),
    del: id => tx("readwrite", s => s.delete(id)).catch(() => null),
  };
})();

/* ---------- recorder ---------- */
const recorder = {
  mr: null, chunks: [], stream: null,
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    this.mr = new MediaRecorder(this.stream, type ? { mimeType: type } : undefined);
    this.chunks = [];
    try {   // a level meter so the waves can move with your voice
      this.actx = new (window.AudioContext || window.webkitAudioContext)();
      this.an = this.actx.createAnalyser(); this.an.fftSize = 1024;
      this.actx.createMediaStreamSource(this.stream).connect(this.an);
      this.buf = new Float32Array(this.an.fftSize);
    } catch { this.an = null; }
    this.mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    this.mr.start(250);
  },
  stop() {
    return new Promise(res => {
      if (!this.mr) return res(null);
      this.mr.onstop = () => {
        this.stream.getTracks().forEach(t => t.stop());
        try { this.actx && this.actx.close(); } catch {}
        this.an = null;
        res(new Blob(this.chunks, { type: this.mr.mimeType || "audio/webm" }));
        this.mr = null;
      };
      this.mr.stop();
    });
  },
  get live() { return !!this.mr; },
  /* loudness right now, 0..1 */
  level() {
    if (!this.an) return 0;
    this.an.getFloatTimeDomainData(this.buf);
    let sum = 0; for (const v of this.buf) sum += v * v;
    return Math.min(1, Math.sqrt(sum / this.buf.length) * 7);
  },
};

const api = {
  takes: async () => { try { const r = await fetch("api/takes"); return r.ok ? await r.json() : []; } catch { return []; } },
  take: async id => (await fetch("api/takes/" + encodeURIComponent(id))).json(),
  analyze: async id => (await fetch("api/takes/" + encodeURIComponent(id) + "/analyze", { method: "POST" })).json(),
  del: id => fetch("api/takes/" + encodeURIComponent(id), { method: "DELETE" }),
  drills: async () => { try { const r = await fetch("api/drills"); return r.ok ? await r.json() : []; } catch { return []; } },
  lessons: async () => { try { const r = await fetch("api/lessons"); return r.ok ? await r.json() : []; } catch { return []; } },
  lesson: async (date, page) => { const r = await fetch("api/lesson", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date, page }) }); if (!r.ok) throw new Error(r.status); return r.json(); },
  done: async id => (await fetch("api/lesson/" + encodeURIComponent(id) + "/done", { method: "POST" })).json(),
  streamStart: async () => { const r = await fetch("api/stream", { method: "POST" }); if (!r.ok) throw new Error(r.status); return (await r.json()).id; },
  streamChunk: (sid, blob) => fetch("api/stream/" + sid, { method: "POST", body: blob }).then(r => r.ok),
  async upload(t) {
    if (t.sid) {
      try { return await this.send(t, t.tail, t.sid); }
      catch (e) { if (!/unknown stream|409/.test(e.message)) throw e; }   // the stream went missing: send it all
    }
    return this.send(t, t.blob);
  },
  async send(t, body, sid) {
    const meta = { kind: t.kind, label: t.label, ts: t.ts, secs: t.secs, text: t.text || "", marks: t.marks || [], drill_id: t.drill_id, lesson_id: t.lesson_id, step: t.step, shadow: t.shadow };
    const headers = { "Content-Type": t.blob.type || "audio/webm", "X-Take-Meta": encodeURIComponent(JSON.stringify(meta)) };
    if (sid) headers["X-Stream-Id"] = sid;
    const r = await fetch("api/takes", { method: "POST", body, headers });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || "upload failed");
    return out;
  },
};
/* Upload anything left in IndexedDB: unsent takes, and recordings made before accounts existed. */
async function flushLocal() {
  let n = 0;
  for (const t of await idb.all()) {
    if (!t.blob) { await idb.del(t.id); continue; }
    try { await api.upload(t); await idb.del(t.id); n++; } catch {}
  }
  return n;
}
let TAKES = [], LESSONS = [];
let DRILLS = [];
async function loadTakes() {
  [TAKES, DRILLS, LESSONS] = await Promise.all([api.takes(), api.drills(), api.lessons()]);
  if (LESSON) LESSON = LESSONS.find(l => l.id === LESSON.id) || LESSON;
  return TAKES;
}
const QUICK = { drill: 1, shadow: 1, enun: 1 };  // graded in ~30s, not a full review
const reads = () => TAKES.filter(t => !QUICK[t.kind]);
const dayKey = ts => new Date(ts).toDateString();
/* "Session 2" when you read more than once that day; "" otherwise. */
function sessionOf(t) {
  if (t.kind !== "daily") return "";
  const same = TAKES.filter(x => x.kind === "daily" && dayKey(x.ts) === dayKey(t.ts));
  return same.length > 1 ? "Session " + (same.filter(x => x.ts <= t.ts).length) : "";
}
/* Record → Stop → save, as a small state machine any button can drive. state: idle | live | saving. */
function makeRecorder(kind, meta, onSaved, onStart, onChange) {
  const r = { state: "idle", t0: 0, msg: "", get elapsed() { return (Date.now() - this.t0) / 1000; } };
  let iv;
  r.toggle = async () => {
    if (r.state === "saving") return;
    if (r.state === "idle") {
      try { await recorder.start(); }
      catch { r.msg = "Microphone blocked. Allow it in your browser’s site settings, then try again."; return onChange(); }
      r.t0 = Date.now(); r.state = "live"; r.msg = ""; onStart && onStart(r.t0);
      /* send audio as it's recorded, so the server transcribes while you talk */
      r.sid = null; r.sent = 0; r.sending = null;
      api.streamStart().then(id => r.sid = id).catch(() => {});
      r.flush = setInterval(() => {
        const n = recorder.chunks.length;
        if (!r.sid || r.sending || n <= r.sent) return;
        r.sending = api.streamChunk(r.sid, new Blob(recorder.chunks.slice(r.sent, n))).then(ok => { if (ok) r.sent = n; else r.sid = null; })
          .catch(() => { r.sid = null; }).finally(() => { r.sending = null; });
      }, 4000);
      iv = setInterval(onChange, 500); return onChange();
    }
    clearInterval(iv); clearInterval(r.flush); r.state = "saving"; onChange();
    const blob = await recorder.stop();
    if (r.sending) await r.sending;
    if (!blob) { r.state = "idle"; return onChange(); }
    const take = { id: kind + ":" + Date.now(), kind, ts: Date.now(), secs: Math.round(r.elapsed), blob, ...meta() };
    if (r.sid) { take.sid = r.sid; take.tail = new Blob(recorder.chunks.slice(r.sent), { type: blob.type }); }
    let saved = take;
    try { saved = await api.upload(take); }
    catch (e) { await idb.put(take); r.msg = "Couldn’t reach the server, so this take is saved on this device and will upload next time. (" + e.message + ")"; }
    markStep("rec");
    await loadTakes();
    r.state = "idle"; onChange();
    onSaved && onSaved(saved);
  };
  return r;
}
const recLabel = (r, again) => r.state === "live" ? "Stop · " + fmt(r.elapsed) : r.state === "saving" ? "Saving…" : again ? "Record again" : "Record";
/* The same voice stage inline (Practice): record, waves while the coach writes notes, then onSaved with the graded take. */
function recWidget(kind, meta, onSaved, onStart) {
  const box = h("div", { class: "inline-rec" });
  let used = false, working = false;
  const wave = listeningWave(96, () => r.state === "live" ? recorder.level() : null);
  const paint = () => {
    const live = r.state === "live", busy = r.state === "saving" || working;
    const btn = bigButton("mic sm" + (live ? " live" : ""), live ? "Stop recording" : "Start recording", r.toggle, icon(live ? "stop" : "mic"));
    if (busy) { btn.disabled = true; btn.classList.add("hide"); }
    box.replaceChildren(voiceStage(wave, btn, r.msg || (live ? "Recording · " + fmt(r.elapsed) : busy ? "Your coach is writing up notes" + (QUICK[kind] ? "…" : " · 1–2 min") : used ? "Tap to record again" : "Tap to record"), live || busy));
  };
  const r = makeRecorder(kind, meta, async saved => {
    if (saved?.id) { working = true; paint(); await untilGraded(saved.id, () => box.isConnected); await loadTakes(); working = false; }
    used = true; paint(); onSaved && onSaved(saved);
  }, onStart, paint);
  paint();
  return box;
}

/* ---------- the "coach is listening" animation: layered waves of light flowing across, like water ---------- */
function listeningWave(height = 120, level) {
  const c = h("canvas", { class: "wave", "aria-hidden": "true", style: "height:" + height + "px" });
  const ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  /* ribbons: colours across, speed, waves across the width, height (fraction of half-height), phase */
  const ribbons = [
    [["#2563eb", "#3b82f6", "#06b6d4"], 0.9, 1.15, 0.95, 0.0],
    [["#7c3aed", "#4f46e5", "#0ea5e9"], -0.7, 1.55, 0.75, 1.9],
    [["#06b6d4", "#6366f1", "#a855f7"], 1.25, 2.05, 0.6, 3.4],
    [["#38bdf8", "#818cf8", "#22d3ee"], -1.6, 2.7, 0.42, 5.0],
  ];
  let t0 = performance.now(), raf = 0, smooth = 0.5, gone = 0;
  const draw = now => {
    if (!c.isConnected) { if (!gone) gone = now; if (now - gone > 1500) return cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); return; }
    gone = 0;
    const dpr = Math.min(devicePixelRatio || 1, 2), W = c.clientWidth || 300, H = height, mid = H / 2;
    if (c.width !== Math.round(W * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = dark ? "screen" : "source-over";
    const t = (now - t0) / 1000;
    const live = level && level();
    smooth += ((live == null || live === false ? 0.7 + 0.3 * Math.sin(t * 1.1) : 0.3 + Math.sqrt(live) * 1.1) - smooth) * 0.12;
    const breathe = smooth;
    const curve = (u, freq, speed, ph) => Math.sin(u * freq * Math.PI * 2 + t * speed * 2.4 + ph) * 0.75 + Math.sin(u * freq * 4.1 + t * speed * 3.7 + ph * 1.7) * 0.25;
    for (const [cols, speed, freq, amp, ph] of ribbons) {
      const g = ctx.createLinearGradient(0, 0, W, 0);
      cols.forEach((col, i) => g.addColorStop(i / (cols.length - 1), col));
      const top = [], bot = [];
      for (let x = 0; x <= W; x += 3) {
        const u = x / W, env = Math.pow(Math.sin(Math.PI * u), 1.6);          // pinched to a point at both ends
        const y = curve(u, freq, speed, ph) * env * amp * breathe * (H * 0.46);
        top.push([x, mid - y]); bot.push([x, mid + y * 0.35 - env * 2]);     // a lens: full curve above, a softer echo below
      }
      ctx.beginPath(); top.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      for (let i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
      ctx.closePath();
      ctx.globalAlpha = dark ? 0.32 : 0.22; ctx.fillStyle = g; ctx.fill();
      /* silk: fine threads riding the ribbon, like light on moving water */
      for (let k = 0; k < 5; k++) {
        const f = 1 - k * 0.17;
        ctx.beginPath();
        top.forEach(([x], i) => { const y = mid - (mid - top[i][1]) * f; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.globalAlpha = (dark ? 0.75 : 0.6) * (1 - k * 0.16); ctx.lineWidth = k ? 0.9 : 2; ctx.strokeStyle = g; ctx.stroke();
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (!still) raf = requestAnimationFrame(draw);
  };
  raf = requestAnimationFrame(draw);
  return c;
}
function listening(text, height) {
  return h("div", { class: "listening-anim", role: "status" }, listeningWave(height), h("div", { class: "listening-text" }, text));
}

/* ---------- coach feedback ---------- */
const SKILLS = [["pitch_variation", "Pitch"], ["stress", "Stress"], ["pace_and_pauses", "Pace"], ["articulation", "Articulation"], ["endings", "Endings"], ["fluency", "Fluency"]];
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* Play just [start, end] of a take, highlighting el while it plays. */
let stopSpan = null;

  audio.currentTime = Math.max(0, start - 0.3); audio.play();

  audio.addEventListener("timeupdate", tick); audio.addEventListener("pause", done);

let actx;
function chime() {

}

  const stop = () => { clearInterval(iv); iv = null; keepAwake(false); paint(); };

    if (left <= 0) left = total;

}

let BOOKS = [], PAGES = [];
function buildPages() {
  PAGES = [];
  for (const b of BOOKS) {
    let cur = [], n = 0;
    for (const para of b.paras) {
      const text = para.map(s => s.t).join(" ");

        left -= 0.25; gapT = setTimeout(step, 250);
      };
      paint(); step();
      return;
    }
    raf = requestAnimationFrame(tick);
  };
  playB.onclick = () => phase === "idle" ? play() : stop();
  againB.onclick = () => { stop(); play(); };
  prevB.onclick = () => { stop(); if (idx > 0) idx--; paint(true); };
  nextB.onclick = () => { stop(); if (idx < flat.length - 1) idx++; paint(true); };
  sel.onchange = () => { stop(); bi = +sel.value; store.set("book", bi); load(); };
  slow.onchange = () => store.set("slow", slow.checked);
  load();
  return { el: h("div", {}, h("div", { class: "bar", style: "margin:0 0 10px" }, sel, h("label", { class: "tog", for: "slow" }, slow, "Slower")),
    h("div", { class: "bar", style: "margin:0 0 6px" }, prevB, playB, againB, nextB), state, box), stop,
    meta: () => { endTurn(); const out = { label: BOOKS[bi].title, shadow: { book: BOOKS[bi].id, sentences: shadowed } }; shadowed = []; return out; },
    onRecStart: t0 => { recT0 = t0; shadowed = []; } };
}

/* ---------- Journey: your path of focuses, every lesson, every recording ---------- */
function renderJourney(v) {
  const days = [], log = dayLog();
  for (let i = 13; i >= 0; i--) { const dt = new Date(); dt.setDate(dt.getDate() - i); days.push(h("i", { class: log[dayStr(dt)]?.length ? "on" : "", title: dayStr(dt) })); }
  v.append(h("div", { class: "head" }, h("h2", {}, "Journey")), installCard(),
    ME?.guest ? h("div", { class: "card install", style: "margin:0 0 14px;padding:14px 16px" },
      h("p", {}, "Your progress is saved on this device. Sign in to keep it on all your devices."),
      h("a", { class: "btn2", href: "api/signin", style: "min-height:44px;padding:0 16px;flex:none" }, "Sign in")) : "",
    h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", {}, "🔥 " + streak()), h("span", {}, "day streak")),
      h("div", { class: "stat" }, h("b", {}, LESSONS.filter(l => l.status === "done").length), h("span", {}, "lessons")),
      h("div", { class: "stat" }, h("b", {}, DRILLS.filter(d => d.stage === "learned" || d.stage === "review").length), h("span", {}, "focuses passed"))),
    h("div", { class: "days", "aria-label": "Last 14 days" }, days));
  /* the path: current focus, then what's in review, what's next, what's learned */
  const by = st => DRILLS.filter(d => d.stage === st);
  const path = h("ol", { class: "path" });
  const node = (d, cls, sub) => {
    const att = (d.attempts || []).slice().sort((a, b) => b.ts - a.ts);
    return h("li", { class: cls }, h("details", {}, h("summary", {}, h("b", {}, d.title), h("span", {}, sub)),
      att.length ? att.map(a => attemptRow(a)) : h("p", { class: "note" }, "No attempts yet.")));
  };
  by("current").forEach(d => path.append(node(d, "cur", "Current focus · passed " + d.passes + " of 3 days")));
  by("review").forEach(d => path.append(node(d, "rev", "Passed · next review " + fmtDay(d.due * 1000))));
  const q = by("queued");
  q.slice(0, 3).forEach(d => path.append(node(d, "next", "Up next" + (d.flags > 1 ? " · raised " + d.flags + " times" : ""))));
  if (q.length > 3) path.append(h("li", { class: "next more" }, h("span", { class: "note" }, "+ " + (q.length - 3) + " more queued")));
  by("learned").forEach(d => path.append(node(d, "learned", "Learned ✓")));
  v.append(h("h3", { class: "sec" }, "Your path"), DRILLS.length ? path : h("p", { class: "note" }, "Your first lesson sets your first focus."));
  /* lessons, newest first, read-only */
  const done = LESSONS.filter(l => l.status === "done" || l.takes.length);
  if (done.length) v.append(h("h3", { class: "sec" }, "Lessons"), ...done.map(l => {
    const d = h("details", { class: "lesson-row" }, h("summary", {}, h("b", {}, (l.kind === "checkin" ? "Check-in · " : "") + "Lesson " + l.n),
      h("span", {}, fmtDay(new Date(l.date + "T12:00").getTime()) + (l.focus ? " · " + l.focus.title : ""))));
    d.addEventListener("toggle", () => { if (d.open && d.children.length === 1) d.append(lessonResults(l, false)); });
    return d;
  }));
  /* everything else: free-play reads, uploads, recordings from before lessons */
  const other = reads().filter(t => !t.lesson_id);
  if (other.length) v.append(h("details", { class: "older" }, h("summary", {}, "Other recordings (" + other.length + ")"),
    h("div", { class: "takes" }, other.map(t => takeRow(t, () => go("journey"), t.kind === "weekly" ? "Weekly" : t.kind === "upload" ? "Uploaded" : "Practice", false)))));
  const scored = reads().filter(t => t.status === "done" && t.feedback?.scores).slice().reverse();
  if (scored.length > 1) {
    const grid = h("div", { class: "sparks" });
    for (const [k, n] of SKILLS) grid.append(spark(n, scored.map(t => ({ ts: t.ts, y: t.feedback.scores?.[k], s: sessionOf(t) })), 1, 5));
    v.append(h("h3", { class: "sec" }, "Read scores over time"), grid);
  }
}

/* One skill over time: a single-series sparkline (latest value large, a dot per session, hover for date). */
function spark(name, pts, lo, hi) {
  pts = pts.filter(p => p.y != null);
  const last = pts[pts.length - 1]?.y ?? "–";
  const ys = pts.map(p => p.y); lo ??= Math.min(...ys) - 5; hi ??= Math.max(...ys) + 5;
  const W = 160, H = 46, pad = 5;
  const X = i => pts.length < 2 ? W / 2 : pad + i * (W - 2 * pad) / (pts.length - 1);
  const Y = y => H - pad - (y - lo) / ((hi - lo) || 1) * (H - 2 * pad);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", name + ": " + ys.join(", "));
  const add = (tag, a, title) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]);
    if (title) { const t = document.createElementNS(ns, "title"); t.textContent = title; e.append(t); } svg.append(e); return e; };
  add("line", { class: "gr", x1: 0, x2: W, y1: H - pad, y2: H - pad, "vector-effect": "non-scaling-stroke" });
  if (pts.length > 1) add("polyline", { class: "ln", points: pts.map((p, i) => X(i) + "," + Y(p.y)).join(" "), "vector-effect": "non-scaling-stroke" });
  pts.forEach((p, i) => add("circle", { class: "dt", cx: X(i), cy: Y(p.y), r: 4, "vector-effect": "non-scaling-stroke" },
    new Date(p.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + (p.s ? " (" + p.s + ")" : "") + ": " + p.y));
  return h("div", { class: "spark" }, h("div", { class: "t" }, h("span", {}, name), h("b", {}, last)), svg);
}

/* The app moved off GitHub Pages so recordings can live in your account. Takes recorded there
   are in that browser only. "Move them to my account" goes to the new site, which signs you in
   and sends you back here with a one-time token; this page then uploads them. */
const HOME = "https://voice-daily.exe.xyz/", OLD = "https://kevinniechen.github.io/voice-daily/";
function oldTakeMeta(t) {
  const n = /^Page (\d+)$/.exec(t.label || ""), pi = t.kind === "weekly" ? 0 : n ? +n[1] - 1 : -1;
  return PAGES[pi] ? pageMeta(pi, t.label) : { label: t.label || "" };
}
async function movedNotice() {
  const old = (await idb.all()).filter(t => t.blob).sort((a, b) => a.ts - b.ts);
  const token = (/#import=(\w+)/.exec(location.hash) || [])[1];
  if (!old.length || (store.get("moved", false) && !token)) { location.replace(HOME); return; }
  try { BOOKS = await (await fetch("books.json")).json(); buildPages(); } catch {}
  const v = $("#view"); v.innerHTML = ""; $("#tabs").hidden = true;
  const status = h("p", { class: "how" });
  v.append(h("div", { class: "head" }, h("h2", {}, "Ten Minute Voice has moved")), status);
  if (token) {
    history.replaceState(null, "", location.pathname);
    let ok = 0, failed = [];
    for (const [i, t] of old.entries()) {
      status.textContent = "Moving your recordings to your account… " + (i + 1) + " of " + old.length;
      try {
        const r = await fetch(HOME + "api/import/take", { method: "POST", body: t.blob, headers: { "Content-Type": t.blob.type || "audio/webm", "X-Import-Token": token,
          "X-Take-Meta": encodeURIComponent(JSON.stringify({ kind: t.kind, ts: t.ts, secs: t.secs, ...oldTakeMeta(t) })) } });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
        ok++;
      } catch (e) { failed.push(e.message); }
    }
    try { const st = store.all(); delete st.moved; await fetch(HOME + "api/import/state", { method: "POST", body: JSON.stringify(st), headers: { "Content-Type": "application/json", "X-Import-Token": token } }); } catch {}
    if (!failed.length) { store.set("moved", true); location.replace(HOME + "#imported=" + ok); return; }
    status.textContent = "Moved " + ok + " of " + old.length + ". The rest didn’t go through (" + failed[0] + "). You can try again or download them below.";
  } else {
    status.textContent = "It now keeps your recordings in your account and gives you coach feedback on each one. You have " + old.length + " recordings saved in this browser. Move them to your account and each one gets reviewed.";
  }
  v.append(h("div", { class: "bar" }, h("a", { class: "btn primary", href: HOME + "?import-old=1" }, "Move them to my account"), h("a", { class: "btn ghost", href: HOME }, "Skip")),
    h("div", { class: "takes" }, old.slice().reverse().map(t => h("div", { class: "take" },
      h("span", { class: "d" }, new Date(t.ts).toLocaleDateString(undefined, { month: "short", day: "numeric" })),
      h("span", { class: "tag" }, (t.label || t.kind) + " · " + fmt(t.secs)),
      h("a", { class: "x", href: URL.createObjectURL(t.blob), download: "voice-" + t.kind + "-" + new Date(t.ts).toISOString().slice(0, 10) + (t.blob.type.includes("mp4") ? ".m4a" : ".webm") }, "Download"),
      h("audio", { controls: true, preload: "none", src: URL.createObjectURL(t.blob) })))));
}
/* New-site half of the move: get a token, hand it to the old site. */
let IMPORTED = false;
async function importHandoff() {
  if (new URLSearchParams(location.search).has("import-old")) {
    const r = await fetch("api/import-token", { method: "POST" }).then(r => r.json()).catch(() => null);
    if (r?.token) { location.replace(OLD + "#import=" + r.token); return true; }
  }
  const n = (/#imported=(\d+)/.exec(location.hash) || [])[1];
  if (n != null) { history.replaceState(null, "", "/"); IMPORTED = true; setTimeout(() => toast("Moved " + n + " recording" + (n === "1" ? "" : "s") + " from the old site. Your coach is reviewing them now."), 300); }
  return false;
}
function toast(msg) {
  const el = h("div", { class: "card", role: "status", style: "margin:0 0 16px;border-color:var(--ok)" }, msg);
  $("#view").before(el); setTimeout(() => el.remove(), 15000);
}

/* Add to home screen: Android/desktop Chrome get a button; iPhone gets the two-tap instructions. Hidden once installed. */
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
function installCard() {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone || store.get("installHidden", false)) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (!ios && !installEvt) return "";
  const card = h("div", { class: "card install", style: "margin:0 0 14px;padding:12px 14px" },
    h("p", {}, ios ? "Use it like an app: tap Share, then “Add to Home Screen”." : "Use it like an app on your home screen."),
    ios ? "" : h("button", { class: "btn primary", type: "button", onclick: async () => { installEvt.prompt(); await installEvt.userChoice; card.remove(); } }, "Install"),
    h("button", { class: "linkbtn", type: "button", "aria-label": "Dismiss", onclick: () => { store.set("installHidden", true); card.remove(); } }, "✕"));
  return card;
}

/* Any audio file (another app, a voice memo) can go through the coach too. */
function uploadWidget(onDone) {
  const input = h("input", { type: "file", accept: "audio/*,video/*,.m4a,.webm,.mp3,.wav", multiple: true, style: "display:none" });
  const msg = h("span", { class: "note" });
  const btn = h("button", { class: "btn", type: "button", onclick: () => input.click() }, "Upload a recording");
  input.addEventListener("change", async () => {
    const files = [...input.files]; input.value = ""; let ok = 0;
    for (const [i, f] of files.entries()) {
      msg.textContent = "Uploading " + (i + 1) + " of " + files.length + "…";
      try { await api.upload({ kind: "upload", label: f.name.replace(/\.[^.]+$/, ""), ts: f.lastModified || Date.now(), secs: 0, blob: f }); ok++; }
      catch (e) { msg.textContent = f.name + ": " + e.message; }
    }
    if (ok) { msg.textContent = "Uploaded " + ok + ". Feedback appears below in a minute or two."; await loadTakes(); onDone && onDone(); }
  });
  return h("div", { class: "bar", style: "margin:0 0 16px" }, btn, input, msg);
}

/* ---------- boot ---------- */
(async () => {
  if (location.hostname.endsWith("github.io")) return movedNotice();
  if (await importHandoff()) return;
  /* No sign-up to start: a first visit gets a guest account on this device. */
  try {
    let r = await fetch("api/me");
    if (r.status === 401) r = await fetch("api/guest", { method: "POST" });
    if (r.ok) ME = await r.json();
    else if (r.status === 429) { $("#view").append(h("div", { class: "empty" }, (await r.json()).error, " ", h("a", { href: "api/signin" }, "Sign in"))); return; }
  } catch {}
  try { navigator.storage?.persist && navigator.storage.persist(); } catch {}
  if (ME) { $("#foot").prepend(h("div", {}, ME.guest ? "Using a guest account on this device." : "Signed in as " + ME.email + ".")); await sync.pull(); }
  current = IMPORTED ? "journey" : store.get("tab", "today");
  try { BOOKS = await (await fetch("books.json")).json(); } catch { BOOKS = []; }
  buildPages();
  if (ME) { await loadTakes(); flushLocal().then(async n => { if (n) { await loadTakes(); go(current); } }); }
  paintHud();
  go(current);
})();
</script>
